<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scanner demo</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; background: #f6f7f9; color: #222; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: #eef0f3; }
  code, .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .status { padding: 1px 6px; border-radius: 3px; color: #fff; }
  .queued { background: #888; } .cloning { background: #2a7ab0; } .scanning { background: #1f5fd1; }
  .completed { background: #2b8a3e; } .failed { background: #c92a2a; } .stopped { background: #d9822b; }
  .bar { width: 120px; height: 10px; background: #ddd; display: inline-block; vertical-align: middle; }
  .bar > div { height: 100%; background: #1f5fd1; }
  #logs { display: flex; gap: 8px; }
  .logcol { flex: 1; min-width: 0; background: #111; color: #ddd; height: 360px; overflow-y: auto; padding: 6px; }
  .logcol h3 { color: #fff; margin: 0 0 4px; font-size: 13px; position: sticky; top: 0; background: #111; }
  .logline { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; font-size: 11px; }
  .lvl-warn { color: #ffd43b; } .lvl-error { color: #ff6b6b; }
  input[type=text] { width: 420px; }
</style>
</head>
<body>
<h2>Start a scan</h2>
<form id="scanForm">
  <input type="text" id="repoUrl" value="https://github.com/maormagori/aws-leak-fixture">
  <button>Scan</button> <span id="formResult" class="mono"></span>
</form>

<h2>Scans</h2>
<table>
  <thead><tr><th>Scan</th><th>Repo</th><th>Status</th><th>Progress</th><th>Findings</th><th>Lease owner</th>
    <th>Lease left</th><th>Token</th><th>Deliveries</th><th>Run after</th><th>Stop req.</th><th>Error</th><th></th></tr></thead>
  <tbody id="scans"></tbody>
</table>

<h2>Recent findings</h2>
<table>
  <thead><tr><th>Committed</th><th>Commit</th><th>Committer</th><th>File:line</th><th>Type</th><th>Value</th></tr></thead>
  <tbody id="findings"></tbody>
</table>

<h2>Logs <span id="project" class="mono"></span></h2>
<div id="logs"></div>

<script>
const LEVELS = { 10: 'trace', 20: 'debug', 30: 'info', 40: 'warn', 50: 'error', 60: 'fatal' };

document.getElementById('scanForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const repoUrl = document.getElementById('repoUrl').value;
  const response = await fetch('/scans', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ repoUrl }) });
  document.getElementById('formResult').textContent = response.status + ' ' + (await response.text()).slice(0, 120);
});

async function postAction(scanId, action) {
  const response = await fetch(`/scans/${scanId}/${action}`, { method: 'POST' });
  document.getElementById('formResult').textContent = `${action}: ${response.status} ${(await response.text()).slice(0, 120)}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function renderScans(state) {
  const now = Date.parse(state.now);
  const rows = [];
  for (const scan of state.scans) {
    const total = scan.totalCommits ?? 0;
    const percent = total > 0 ? Math.round(100 * scan.scannedCommits / total) : 0;
    const leaseSecondsLeft = scan.leaseExpiresAt ? Math.round((Date.parse(scan.leaseExpiresAt) - now) / 1000) : '';
    rows.push(`<tr>
      <td class="mono">${scan.id.slice(0, 8)}</td>
      <td>${escapeHtml(scan.repoUrl)}</td>
      <td><span class="status ${scan.status}">${scan.status}</span></td>
      <td><span class="bar"><div style="width:${percent}%"></div></span> ${scan.scannedCommits}/${scan.totalCommits ?? '?'}</td>
      <td>${state.findingCounts[scan.id] ?? 0}</td>
      <td class="mono">${escapeHtml(scan.leaseOwner)}</td>
      <td>${leaseSecondsLeft === '' ? '' : leaseSecondsLeft + 's'}</td>
      <td>${scan.leaseToken}</td>
      <td>${scan.deliveryCount}</td>
      <td class="mono">${escapeHtml(scan.runAfter)}</td>
      <td>${scan.stopRequested ? 'yes' : ''}</td>
      <td>${escapeHtml(scan.error)}</td>
      <td><button onclick="postAction('${scan.id}','stop')">stop</button>
          <button onclick="postAction('${scan.id}','resume')">resume</button></td>
    </tr>`);
  }
  document.getElementById('scans').innerHTML = rows.join('');
}

function renderFindings(state) {
  const rows = [];
  for (const finding of state.recentFindings) {
    rows.push(`<tr>
      <td>${escapeHtml(finding.committedAt)}</td>
      <td class="mono">${finding.commitSha.slice(0, 10)}</td>
      <td>${escapeHtml(finding.committerName)}</td>
      <td class="mono">${escapeHtml(finding.filePath)}:${finding.lineNumber}</td>
      <td>${finding.leakType}</td>
      <td class="mono">${escapeHtml(finding.leakValue)}</td>
    </tr>`);
  }
  document.getElementById('findings').innerHTML = rows.join('');
}

// A log line is "<docker timestamp> <text>"; pino lines may carry a "[role] " prefix before the JSON.
function formatLogLine(line) {
  const text = line.slice(line.indexOf(' ') + 1);
  const jsonStart = text.indexOf('{');
  if (jsonStart === -1) return { html: escapeHtml(text), level: '' };
  try {
    const entry = JSON.parse(text.slice(jsonStart));
    const time = new Date(entry.time).toISOString().slice(11, 19);
    const level = LEVELS[entry.level] ?? entry.level;
    const scanPart = entry.scanId ? ` scan=${entry.scanId.slice(0, 8)}` : '';
    const errorPart = entry.err ? ` err=${entry.err.message}` : '';
    return { html: escapeHtml(`${time} ${level} ${entry.msg}${scanPart}${errorPart}`), level };
  } catch {
    return { html: escapeHtml(text), level: '' };
  }
}

function renderLogs(logs) {
  document.getElementById('project').textContent = `(compose project: ${logs.project})`;
  const linesByContainer = {};
  for (const { container, line } of logs.lines) {
    linesByContainer[container] ??= [];
    linesByContainer[container].push(formatLogLine(line));
  }
  const panel = document.getElementById('logs');
  for (const container of Object.keys(linesByContainer).sort()) {
    let column = document.getElementById('log-' + container);
    if (!column) {
      column = document.createElement('div');
      column.className = 'logcol';
      column.id = 'log-' + container;
      panel.appendChild(column);
    }
    const isAtBottom = column.scrollTop + column.clientHeight >= column.scrollHeight - 20;
    const lineHtml = linesByContainer[container]
      .map((formatted) => `<div class="logline lvl-${formatted.level}">${formatted.html}</div>`);
    column.innerHTML = `<h3>${escapeHtml(container)}</h3>` + lineHtml.join('');
    if (isAtBottom) column.scrollTop = column.scrollHeight;
  }
}

async function poll() {
  try {
    const state = await (await fetch('/state')).json();
    renderScans(state);
    renderFindings(state);
    renderLogs(await (await fetch('/logs')).json());
  } catch (error) {
    document.getElementById('project').textContent = 'poll failed: ' + error;
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
